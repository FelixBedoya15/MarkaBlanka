# Do not edit this file directly. Use a ‘docker-compose.override.yaml’ file if you can.
# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:
  api:
    env_file:
      - .env
    container_name: somossst-api
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongodb
      - rag_api
    build:
      context: .
      dockerfile: Dockerfile.multi # Usando Dockerfile.multi para mejor rendimiento
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/SomosSST}
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - ALLOW_INSECURE_LOCAL_IP=true
      - SEARXNG_INSTANCE_URL=${SEARXNG_INSTANCE_URL}
      - SEARXNG_ENABLED=true
    volumes:
      #- type: bind
      #  source: ./.env
      #  target: /app/.env
      - somossst_uploads:/app/uploads
      - somossst_logs:/app/logs
      - somossst_images:/app/client/public/images

    networks:
      - dokploy-network
  mongodb:
    container_name: somossst-mongodb
    image: mongo:4.4.18
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - mongodb_data:/data/db
    #  - ./data-node:/data/db
    command: mongod --noauth
    networks:
      - dokploy-network
  meilisearch:
    container_name: somossst-meilisearch
    image: getmeili/meilisearch:v1.12.3
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      #- MEILI_HOST=http://chat-meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - meili_data_v1.12:/meili_data
    networks:
      - dokploy-network
  vectordb:
    container_name: somossst-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
    networks:
      - dokploy-network
  rag_api:
    container_name: somossst-rag-api
    build: ./rag_api
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env
    networks:
      - dokploy-network

volumes:
  pgdata2:
  mongodb_data:
  somossst_uploads:
  somossst_logs:
  somossst_images:
  meili_data_v1.12:

networks:
  dokploy-network:
    external: true
