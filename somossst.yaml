# Definition of custom endpoints
endpoints:
  google:
    title: "Google"
    apiKey: "${GOOGLE_KEY}"
    models:
      default:
        - "gemini-3.1-flash-lite"
        - "gemini-3-flash-preview"
        - "gemini-2.5-flash"
        - "gemini-2.5-flash-lite"
      fetch: false
    titleModel: "gemini-3.1-flash-lite"
  agents:
  #   # (optional) Default recursion depth for agents, defaults to 25
      recursionLimit: 100
  #   # (optional) Max recursion depth for agents, defaults to 25
      maxRecursionLimit: 100
  #   # (optional) Disable the builder interface for agents
      disableBuilder: false
  #   # (optional) Supported agent IDs, only these agents will be available
  #   # (optional) Maximum total citations to include in agent responses, defaults to 30
      maxCitations: 50
  #   # (optional) Maximum citations per file to include in agent responses, defaults to 7
      maxCitationsPerFile: 7
  #   # (optional) Minimum relevance score for sources to be included in responses, defaults to 0.45 (45% relevance threshold)
  #   # Set to 0.0 to show all sources (no filtering), or higher like 0.7 for stricter filtering
      minRelevanceScore: 0.45
  #   # (optional) Agent Capabilities available to all users. Omit the ones you wish to exclude. Defaults to list below.
      capabilities: ["execute_code", "file_search", "actions", "tools", "artifacts", "context", "ocr", "chain", "web_search"]
      titleEndpoint: "google"
      titleModel: "gemini-3.1-flash-lite"
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1"
      models:
        default: [
          "deepseek-r1:1.5b",
          "gemma2:2b",
          "qwen2:0.5b",
          "codellama",
          "dolphin-mixtral",
          "mistral-openorca"
          ]
        fetch: true
      titleConvo: true
      titleEndpoint: "google"
      titleModel: "gemini-3.1-flash-lite"
      summarize: false
      summaryModel: "current_model"
      forcePrompt: false
      modelDisplayLabel: "Ollama"

    - name: "Somos SST"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1/" 
      models:
        default: [
          "deepseek-r1:1.5b",
          "gemma2:2b",
          "qwen2:0.5b",
          "codellama",
          "dolphin-mixtral",
          "mistral-openorca"
          ]
        fetch: true
      titleConvo: true
      titleEndpoint: "google"
      titleModel: "gemini-3.1-flash-lite"
      summarize: false
      summaryModel: "current_model"
      forcePrompt: false
      modelDisplayLabel: "Somos SST"

    # Groq Endpoint
    - name: 'Groq'
      apiKey: 'user_provided'
      baseURL: 'https://api.groq.com/openai/v1/'
      models:
        default:
          - 'allam-2-7b'
          - 'canopylabs/orpheus-arabic-saudi'
          - 'canopylabs/orpheus-v1-english'
          - 'groq/compound'
          - 'groq/compound-mini'
          - 'llama-3.1-8b-instant'
          - 'llama-3.3-70b-versatile'
          - 'meta-llama/llama-4-maverick-17b-128e-instruct'
          - 'meta-llama/llama-4-scout-17b-16e-instruct'
          - 'meta-llama/llama-guard-4-12b'
          - 'meta-llama/llama-prompt-guard-2-22m'
          - 'meta-llama/llama-prompt-guard-2-86m'
          - 'moonshotai/kimi-k2-instruct'
          - 'moonshotai/kimi-k2-instruct-0905'
          - 'openai/gpt-oss-120b'
          - 'openai/gpt-oss-20b'
          - 'openai/gpt-oss-safeguard-20b'
          - 'qwen/qwen3-32b'
          - 'whisper-large-v3'
          - 'whisper-large-v3-turbo'
        fetch: true
      titleConvo: true
      titleEndpoint: "google"
      titleModel: "gemini-3.1-flash-lite"
      modelDisplayLabel: 'Groq'

    - name: "NVIDIA"
      apiKey: "user_provided"
      baseURL: "https://integrate.api.nvidia.com/v1"
      models:
        default: 
          - "meta/llama-3.1-405b-instruct"
          - "meta/llama-3.1-70b-instruct"
          - "google/gemma-3-27b-it"
          - "google/gemma-3-1b-it"
          - "google/gemma-2-27b-it"
          - "google/gemma-2-9b-it"
          - "deepseek-ai/deepseek-r1"
          - "deepseek-ai/deepseek-coder-6.7b-instruct"
          - "moonshotai/kimi-k2.5" 
          - "mistralai/mixtral-8x22b-instruct-v0.1"
          - "nvidia/nemotron-4-340b-instruct"
        fetch: true
      titleConvo: true
      titleEndpoint: "google"
      titleModel: "gemini-3.1-flash-lite"
      modelDisplayLabel: "NVIDIA"
      iconURL: "https://upload.wikimedia.org/wikipedia/commons/2/21/Nvidia_logo_image.png"
      dropParams: ["user", "frequency_penalty", "presence_penalty", "stop"]

# Memory configuration for user memories
memory:
  disabled: false
  tokenLimit: 30000
  personalize: true
  agent:
    provider: "google"
    model: "gemini-3.1-flash-lite"
    model_parameters:
      temperature: 0.1
